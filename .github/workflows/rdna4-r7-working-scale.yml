name: RDNA4 r7.1 AMD WorkingScale performance build
on:
  push:
    branches: [dlssnr-rdna4-r7-working-scale]
    paths: ['.github/workflows/rdna4-r7-working-scale.yml', 'rdna4/r7/**']
permissions:
  contents: read
concurrency:
  group: rdna4-r71-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
      - name: Checkout exact upstream into short workspace
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $up='D:/u'
          if (Test-Path $up) { Remove-Item $up -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $up | Out-Null
          git -C $up init
          git -C $up config core.longpaths true
          git -C $up remote add origin https://github.com/MatheusGViana/dlss-5-amd-project.git
          git -C $up -c core.longpaths=true fetch --no-tags --depth=1 origin e58ff27a3d5ac86184875e01b317ff1463a247c1
          if ($LASTEXITCODE -ne 0) { throw 'Pinned upstream fetch failed' }
          git -C $up -c core.longpaths=true checkout --detach FETCH_HEAD
          if ((git -C $up rev-parse HEAD).Trim() -ne 'e58ff27a3d5ac86184875e01b317ff1463a247c1') { throw 'Wrong upstream commit' }
      - name: Verify AMD WorkingScale patch is required
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $up='D:/u'
          $amd=Join-Path $up 'OptiScaler-DLSSNR-PreSR-Multipass-main/OptiScaler/dlssnr/amd/AmdBridge.cpp'
          $cfg=Join-Path $up 'OptiScaler-DLSSNR-PreSR-Multipass-main/OptiScaler/Config.h'
          $readme=Join-Path $up 'analysis/LEIA-ME-AMD.md'
          if (!(Select-String -LiteralPath $cfg -Pattern 'DlssNrWorkingScale' -Quiet)) { throw 'WorkingScale configuration missing upstream' }
          if (Select-String -LiteralPath $amd -Pattern 'DlssNrWorkingScale' -Quiet) { throw 'AMD backend already consumes WorkingScale; re-audit' }
          if (!(Select-String -LiteralPath $readme -Pattern 'WorkingScale.*não são controles do backend AMD' -Quiet)) { throw 'AMD scope statement changed' }
          @{ upstream_commit='e58ff27a3d5ac86184875e01b317ff1463a247c1'; r7_patch_required=$true; target='RX 9070 XT / gfx1201'; gpu_tested=$false } | ConvertTo-Json | Set-Content r7-source-gate.json -Encoding utf8
      - name: Apply AMD-native reduced neural raster patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='D:/u/OptiScaler-DLSSNR-PreSR-Multipass-main'
          python rdna4/r7/patch_amd_working_scale.py $root
          if ($LASTEXITCODE -ne 0) { throw 'AMD WorkingScale patch failed' }
          python rdna4/r7/fixup_and_export_shaders.py $root
          if ($LASTEXITCODE -ne 0) { throw 'AMD WorkingScale fixup failed' }
          Copy-Item (Join-Path $root 'r7-patch-report.json') .
          Copy-Item (Join-Path $root 'r7-fixup-report.json') .
      - name: Compile all new embedded HLSL as shader model 5
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $shaderDir='D:/u/OptiScaler-DLSSNR-PreSR-Multipass-main/r7-shaders'
          $fxc=Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin' -Recurse -Filter fxc.exe | Where-Object { $_.FullName -match 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$fxc) { throw 'fxc.exe not found' }
          New-Item -ItemType Directory -Force -Path r7-shader-bin | Out-Null
          foreach($shader in Get-ChildItem $shaderDir -Filter '*.hlsl') {
            $out=Join-Path 'r7-shader-bin' ($shader.BaseName+'.cso')
            & $fxc.FullName /nologo /T cs_5_0 /E main /O3 /Fo $out $shader.FullName
            if ($LASTEXITCODE -ne 0) { throw "Shader compile failed: $($shader.Name)" }
          }
          if ((Get-ChildItem r7-shader-bin -Filter '*.cso').Count -ne 4) { throw 'Expected four compiled shaders' }
      - name: Build patched OptiScaler x64 Release
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='D:/u/OptiScaler-DLSSNR-PreSR-Multipass-main'
          $vswhere="${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs=& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC x64 toolchain missing' }
          $msbuild=Join-Path $vs 'MSBuild/Current/Bin/MSBuild.exe'
          $kits='C:/Program Files (x86)/Windows Kits/10/Include'
          $sdk=Get-ChildItem $kits -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'um/windows.h') } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (!$sdk) { throw 'Windows SDK missing' }
          Set-Content -LiteralPath (Join-Path $root 'OptiScaler/resource_build_date.h') -Value ('#define VER_BUILD_DATE "'+(Get-Date -Format 'yyyyMMdd_HHmmss')+'"') -Encoding ascii
          Set-Content -LiteralPath (Join-Path $root 'OptiScaler/resource_build_commit.h') -Value '#define VER_BUILD_COMMIT "rdna4-r7.1-amd-working-scale-e58ff27"' -Encoding ascii
          $log=(Resolve-Path '.').Path+'\r7-msbuild.log'
          & $msbuild (Join-Path $root 'OptiScaler.sln') /m:4 /t:Build /p:Configuration=Release /p:Platform=x64 "/p:WindowsTargetPlatformVersion=$($sdk.Name)" /p:PreBuildEventUseInBuild=false /p:PostBuildEventUseInBuild=false /v:minimal /fl "/flp:logfile=$log;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 350; throw 'Patched upstream build failed' }
          $release=Join-Path $root 'x64/Release/a'
          $opt=Join-Path $release 'OptiScaler.dll'
          $fwd=Join-Path $release 'nvngx.dll_dlssnr.dll'
          if (!(Test-Path $opt)) { throw 'Build output missing: OptiScaler.dll' }
          if (!(Test-Path $fwd)) { throw 'Build output missing: nvngx.dll_dlssnr.dll' }
          Get-Item $opt,$fwd | Select-Object FullName,Length
      - name: Static scale-one and AMD wiring gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='D:/u/OptiScaler-DLSSNR-PreSR-Multipass-main'
          $backend=Get-Content (Join-Path $root 'OptiScaler/dlssnr/amd/AmdPreSr.cpp') -Raw
          $bridge=Get-Content (Join-Path $root 'OptiScaler/dlssnr/amd/AmdBridge.cpp') -Raw
          foreach($needle in @('s.workingScale = std::clamp','workProcessed','workBase','packet.scaleX = f.motionScaleX;','packet.scaleY = f.motionScaleY;','if (scaled && accepted')) { if (($backend+$bridge).IndexOf($needle) -lt 0) { throw "Missing r7.1 contract: $needle" } }
          if ($backend.IndexOf('scaled ? p->workColour.Get() : p->colour.Get()') -lt 0) { throw 'Scale=1 legacy branch missing' }
          if ($backend.IndexOf('f.motionScaleX * (float(workW) / float(w))') -ge 0) { throw 'Motion vectors would be double-scaled' }
          @{ amd_working_scale_wired=$true; scale1_legacy_path=$true; scale_lt_1_reduced_neural_raster=$true; full_res_base_preserved=$true; motion_scale_passthrough=$true; gpu_tested=$false; game_tested=$false } | ConvertTo-Json | Set-Content r7-static-gate.json -Encoding utf8
      - name: Assemble ready-to-test AMD overlay and presets
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src='D:/u/OptiScaler-DLSSNR-PreSR-Multipass-main'
          $release=Join-Path $src 'x64/Release/a'
          $opt=Join-Path $release 'OptiScaler.dll'
          $fwd=Join-Path $release 'nvngx.dll_dlssnr.dll'
          $static='D:/u/package-amd-presr'
          New-Item -ItemType Directory -Force -Path package,package/presets,package/reports,package/source | Out-Null
          Copy-Item $opt package/OptiScaler.dll
          Copy-Item $fwd package/nvngx.dll_dlssnr.dll
          foreach($name in @('dlssnr_amd_pass1.dll','dlssnr_amd_pass2.dll','dlssnr_amd_pass3.dll')) { Copy-Item (Join-Path $static $name) package/$name }
          Copy-Item (Join-Path $static 'dlssnr_on_amd.ini') package/ -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $src 'OptiScaler.ini') package/OptiScaler.ini
          Copy-Item r7-source-gate.json,r7-patch-report.json,r7-fixup-report.json,r7-static-gate.json,r7-msbuild.log package/reports/
          Copy-Item r7-shader-bin package/reports/ -Recurse
          Copy-Item rdna4/r7/*.py package/source/
          Copy-Item (Join-Path $src 'OptiScaler/dlssnr/amd/AmdPreSr.cpp') package/source/AmdPreSr.r71.cpp
          Copy-Item (Join-Path $src 'OptiScaler/dlssnr/amd/AmdPreSr.h') package/source/AmdPreSr.r71.h
          Copy-Item (Join-Path $src 'OptiScaler/dlssnr/amd/AmdBridge.cpp') package/source/AmdBridge.r71.cpp
          function New-ScalePreset([string]$name,[string]$value) {
            $lines=Get-Content (Join-Path $src 'OptiScaler.ini');$inside=$false;$changed=0
            for($i=0;$i -lt $lines.Count;$i++) {
              if($lines[$i] -match '^\s*\[(.+)\]\s*$') { $inside=($Matches[1] -eq 'DlssNr') }
              elseif($inside -and $lines[$i] -match '^\s*WorkingScale\s*=') { $lines[$i]="WorkingScale=$value";$changed++ }
            }
            if($changed -ne 1) { throw "Expected one [DlssNr] WorkingScale entry, got $changed" }
            $lines | Set-Content "package/presets/$name.ini" -Encoding utf8
          }
          New-ScalePreset 'WorkingScale_100_REFERENCE' '1.0'
          New-ScalePreset 'WorkingScale_085_QUALITY' '0.85'
          New-ScalePreset 'WorkingScale_075_BALANCED' '0.75'
          New-ScalePreset 'WorkingScale_067_PERFORMANCE' '0.67'
          New-ScalePreset 'WorkingScale_050_ULTRA' '0.50'
          New-ScalePreset 'WorkingScale_025_DIAGNOSTIC_ONLY' '0.25'
          @'
          RDNA4 r7.1 AMD-native WorkingScale Test
          ======================================
          Manual RX 9070 XT performance/quality experiment; not yet a validated final release.

          Keep the existing dlssnr_on_amd_weights.bin. Test presets in order: 1.00, 0.85, 0.75, 0.67, 0.50; 0.25 is diagnostic only.
          For each preset, copy it over OptiScaler.ini and use the same game scene/settings. amd_presr.log must show base=... work=... with reduced work dimensions below scale 1.0.
          Compare GPU frame time/FPS plus NR detail, temporal stability, disocclusion edges and ghosting.
          Scale<1 intentionally changes the neural working raster, so byte-identical output to 1.0 is not expected.
          CI compiled the C++, all four HLSL shaders, and linked OptiScaler.dll; CI has no RX 9070 XT and did not execute the private HIP runtime.
          Pinned upstream: e58ff27a3d5ac86184875e01b317ff1463a247c1.
          '@ | Set-Content package/README_R7_AMD_WORKINGSCALE.txt -Encoding utf8
          @{ revision='r7.1'; commit=$env:GITHUB_SHA; upstream='e58ff27a3d5ac86184875e01b317ff1463a247c1'; target='RX 9070 XT / gfx1201'; amd_working_scale_implemented=$true; scale1_gate_passed=$true; four_hlsl_compile_gate_passed=$true; optiscaler_release_link_passed=$true; target_gpu_tested_in_ci=$false; game_tested=$false; final_release=$false } | ConvertTo-Json | Set-Content package/BUILD_STATUS.json -Encoding utf8
          $root=(Resolve-Path package).Path
          Get-ChildItem package -Recurse -File | Sort-Object FullName | ForEach-Object { $rel=$_.FullName.Substring($root.Length+1).Replace('\','/'); '{0} *{1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(),$rel } | Set-Content package/SHA256SUMS.txt -Encoding ascii
          Get-ChildItem package -Recurse -File | Select-Object FullName,Length
      - name: Upload ready-to-test r7 AMD overlay ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RDNA4-r7.1-AMD-WorkingScale-Test
          path: package/
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
