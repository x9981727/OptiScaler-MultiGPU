name: Dispatch v22 XeFG Safe Backpressure Build

on:
  push:
    branches: [fix/v22-xefg-safe-backpressure]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing build workflow on this v22 ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-multigpu-unsigned.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
