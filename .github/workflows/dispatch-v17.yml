name: Dispatch v20 XeFG Frozen Baseline Build

on:
  push:
    branches: [fix/v20-freeze-active-frametime]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing build workflow on this v20 ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-multigpu-unsigned.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
