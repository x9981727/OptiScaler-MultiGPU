name: Dispatch v23 XeFG Render Export Overlap Build

on:
  push:
    branches: [fix/v23-xefg-render-export-overlap]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing build workflow on this v23 ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-multigpu-unsigned.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
