name: Dispatch v19 XeFG Cadence Hold Build

on:
  push:
    branches: [fix/v19-xefg-present-latency]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing build workflow on this v19 ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-multigpu-unsigned.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
