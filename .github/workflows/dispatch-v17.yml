name: Dispatch v18 XeFG Input Frame Time Build

on:
  push:
    branches: [fix/v18-xefg-input-frametime]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing build workflow on this v18 ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-multigpu-unsigned.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
