name: Build OptiScaler 0.9.4 MultiGPU FSRFG v3 (Unsigned)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4

      - name: Reconstruct base MultiGPU patch
        shell: powershell
        run: |
          $parts = Get-ChildItem "$env:GITHUB_WORKSPACE\patch.b64.part*" | Sort-Object Name
          if ($parts.Count -eq 0) { throw "No patch parts found" }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE\OptiScaler-0.9.4-MultiGPU-FSRFG-WIP.patch", [Convert]::FromBase64String($b64))

      - name: Reconstruct v2 dual-context hotfix
        shell: powershell
        run: |
          $names = @(
            "hotfix-exact.b64.part00",
            "hotfix-exact.b64.part01",
            "hotfix-exact.b64.part02",
            "hotfix-exact.b64.part03",
            "hotfix-exact.b64.part04",
            "hotfix-exact.b64.part05",
            "hotfix-exact.b64.part06"
          )
          $b64 = ($names | ForEach-Object {
            $path = Join-Path $env:GITHUB_WORKSPACE $_
            if (-not (Test-Path $path)) { throw "Missing v2 hotfix part: $_" }
            (Get-Content $path -Raw).Trim()
          }) -join ''
          $bytes = [Convert]::FromBase64String($b64)
          $hotfixPath = "$env:GITHUB_WORKSPACE\MultiGPU-v2-dual-context-hotfix.patch"
          [IO.File]::WriteAllBytes($hotfixPath, $bytes)
          $sha = (Get-FileHash $hotfixPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne "e35187ee474aa07b4a7183ea41e86a96491b99841bc7b09d3983fdea96f9219a") {
            throw "v2 hotfix SHA256 mismatch: $sha"
          }

      - name: Clone OptiScaler v0.9.4 with submodules
        shell: powershell
        run: |
          git clone --branch v0.9.4 --depth 1 --recurse-submodules https://github.com/optiscaler/OptiScaler.git upstream
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C upstream submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply base MultiGPU patch
        shell: powershell
        run: |
          $patch = Join-Path $env:GITHUB_WORKSPACE "OptiScaler-0.9.4-MultiGPU-FSRFG-WIP.patch"
          git -C upstream apply --check $patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C upstream apply $patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore MultiGPU source files
        shell: powershell
        run: |
          function Restore-Base64Parts([string]$pattern, [string]$destination) {
            $parts = Get-ChildItem $pattern | Sort-Object Name
            if ($parts.Count -eq 0) { throw "No source parts found: $pattern" }
            $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
            [IO.File]::WriteAllBytes($destination, [Convert]::FromBase64String($b64))
            Write-Host "Restored $destination ($((Get-Item $destination).Length) bytes)"
          }
          $header = "$env:GITHUB_WORKSPACE\upstream\OptiScaler\framegen\MultiGPU_Dx12.h"
          $source = "$env:GITHUB_WORKSPACE\upstream\OptiScaler\framegen\MultiGPU_Dx12.cpp"
          Restore-Base64Parts "$env:GITHUB_WORKSPACE\src\MultiGPU_Dx12.h.b64.part*" $header
          Restore-Base64Parts "$env:GITHUB_WORKSPACE\src\MultiGPU_Dx12.cpp.b64.part*" $source
          $text = [IO.File]::ReadAllText($source)
          $text = $text.Replace("CreateCommandAlocator", "CreateCommandAllocator")
          [IO.File]::WriteAllText($source, $text, [Text.UTF8Encoding]::new($false))
          if ([IO.File]::ReadAllText($source).Contains("CreateCommandAlocator")) { throw "MultiGPU source typo fixup failed" }

      - name: Apply v2 dual-context hotfix
        shell: powershell
        run: |
          $hotfix = Join-Path $env:GITHUB_WORKSPACE "MultiGPU-v2-dual-context-hotfix.patch"
          git -C upstream apply --check --exclude=OptiScaler/framegen/MultiGPU_Dx12.cpp $hotfix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C upstream apply --exclude=OptiScaler/framegen/MultiGPU_Dx12.cpp $hotfix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fsrfg = Join-Path $env:GITHUB_WORKSPACE "upstream\OptiScaler\framegen\ffx\FSRFG_Dx12.cpp"
          $text = [IO.File]::ReadAllText($fsrfg)
          $text = $text.Replace("auto computeResult = FFX_API_RETURN_OK;", "ffxReturnCode_t computeResult = FFX_API_RETURN_OK;")
          [IO.File]::WriteAllText($fsrfg, $text, [Text.UTF8Encoding]::new($false))

      - name: Apply v3 scoped AMD internal adapter override
        shell: powershell
        run: |
          $hooksH = Join-Path $env:GITHUB_WORKSPACE "upstream\OptiScaler\hooks\D3D12_Hooks.h"
          $hooksCpp = Join-Path $env:GITHUB_WORKSPACE "upstream\OptiScaler\hooks\D3D12_Hooks.cpp"
          $fsrfg = Join-Path $env:GITHUB_WORKSPACE "upstream\OptiScaler\framegen\ffx\FSRFG_Dx12.cpp"

          $h = [IO.File]::ReadAllText($hooksH)
          if (-not $h.Contains("SetMultiGPUFGAdapterOverride")) {
            $needle = "    static void Hook();"
            if (-not $h.Contains($needle)) { throw "D3D12_Hooks.h insertion point not found" }
            $h = $h.Replace($needle, "    static void SetMultiGPUFGAdapterOverride(bool enable);`n$needle")
          }
          [IO.File]::WriteAllText($hooksH, $h, [Text.UTF8Encoding]::new($false))

          $cpp = [IO.File]::ReadAllText($hooksCpp)
          if (-not $cpp.Contains('#include <framegen/MultiGPU_Dx12.h>')) {
            $includeNeedle = '#include <Config.h>'
            if (-not $cpp.Contains($includeNeedle)) { throw "D3D12_Hooks.cpp include insertion point not found" }
            $cpp = $cpp.Replace($includeNeedle, "$includeNeedle`n#include <framegen/MultiGPU_Dx12.h>")
          }

          if (-not $cpp.Contains("_forceMultiGPUFGAdapter")) {
            $stateNeedle = 'static LUID _lastAdapterLuid = {};'
            if (-not $cpp.Contains($stateNeedle)) { throw "D3D12_Hooks.cpp state insertion point not found" }
            $cpp = $cpp.Replace($stateNeedle, "$stateNeedle`nstatic thread_local bool _forceMultiGPUFGAdapter = false;")
          }

          if (-not $cpp.Contains("void D3D12Hooks::SetMultiGPUFGAdapterOverride")) {
            $fnNeedle = 'VALIDATE_HOOK(hkD3D12CreateDevice, D3d12Proxy::PFN_D3D12CreateDevice)'
            if (-not $cpp.Contains($fnNeedle)) { throw "hkD3D12CreateDevice marker not found" }
            $setter = @(
              'void D3D12Hooks::SetMultiGPUFGAdapterOverride(bool enable)',
              '{',
              '    _forceMultiGPUFGAdapter = enable;',
              '    LOG_DEBUG("MultiGPU: scoped internal D3D12 adapter override: {}", enable);',
              '}',
              ''
            ) -join "`n"
            $cpp = $cpp.Replace($fnNeedle, $setter + "`n" + $fnNeedle)
          }

          if (-not $cpp.Contains("forcing internal D3D12CreateDevice(nullptr)")) {
            $fnPos = $cpp.IndexOf('static HRESULT hkD3D12CreateDevice')
            if ($fnPos -lt 0) { throw "hkD3D12CreateDevice function not found" }
            $logNeedle = 'Util::WhoIsTheCaller(_ReturnAddress()));'
            $logPos = $cpp.IndexOf($logNeedle, $fnPos)
            if ($logPos -lt 0) { throw "hkD3D12CreateDevice log insertion point not found" }
            $insertPos = $logPos + $logNeedle.Length
            $overrideCode = @(
              '',
              '',
              '    Microsoft::WRL::ComPtr<IDXGIAdapter1> forcedMultiGpuAdapter;',
              '    if (_forceMultiGPUFGAdapter && pAdapter == nullptr)',
              '    {',
              '        IDXGIAdapter1* rawAdapter = nullptr;',
              '        if (MultiGPU::TryGetAdapterByLuid(Config::Instance()->FGAdapterLuid.value_or_default(), &rawAdapter))',
              '        {',
              '            forcedMultiGpuAdapter.Attach(rawAdapter);',
              '            pAdapter = forcedMultiGpuAdapter.Get();',
              '            LOG_INFO("MultiGPU: forcing internal D3D12CreateDevice(nullptr) to configured FG adapter");',
              '        }',
              '        else',
              '        {',
              '            LOG_ERROR("MultiGPU: failed to resolve configured FG adapter for internal D3D12CreateDevice");',
              '        }',
              '    }'
            ) -join "`n"
            $cpp = $cpp.Insert($insertPos, $overrideCode)
          }
          [IO.File]::WriteAllText($hooksCpp, $cpp, [Text.UTF8Encoding]::new($false))

          $f = [IO.File]::ReadAllText($fsrfg)
          if (-not $f.Contains('#include <hooks/D3D12_Hooks.h>')) {
            $firstInclude = '#include "FSRFG_Dx12.h"'
            if (-not $f.Contains($firstInclude)) { throw "FSRFG_Dx12 include insertion point not found" }
            $f = $f.Replace($firstInclude, "$firstInclude`n#include <hooks/D3D12_Hooks.h>")
          }

          if (-not $f.Contains("SetMultiGPUFGAdapterOverride(true)")) {
            $ctxNeedle = 'FfxApiProxy::D3D12_CreateContext(&_multiGpuComputeContext'
            $ctxPos = $f.IndexOf($ctxNeedle)
            if ($ctxPos -lt 0) { throw "secondary compute context creation call not found" }
            $secondCtxPos = $f.IndexOf($ctxNeedle, $ctxPos + $ctxNeedle.Length)
            if ($secondCtxPos -ge 0) { throw "unexpected multiple secondary compute context creation calls" }

            $lineStart = $f.LastIndexOf("`n", $ctxPos)
            if ($lineStart -lt 0) { $lineStart = 0 } else { $lineStart++ }
            $semi = $f.IndexOf(';', $ctxPos)
            if ($semi -lt 0) { throw "secondary compute context statement terminator not found" }
            $lineText = $f.Substring($lineStart, $semi - $lineStart + 1)
            $indent = [regex]::Match($lineText, '^\s*').Value

            $f = $f.Insert($semi + 1, "`n${indent}D3D12Hooks::SetMultiGPUFGAdapterOverride(false);")
            $f = $f.Insert($lineStart, "${indent}D3D12Hooks::SetMultiGPUFGAdapterOverride(true);`n")
          }
          [IO.File]::WriteAllText($fsrfg, $f, [Text.UTF8Encoding]::new($false))

          $checkH = [IO.File]::ReadAllText($hooksH)
          $checkCpp = [IO.File]::ReadAllText($hooksCpp)
          $checkF = [IO.File]::ReadAllText($fsrfg)
          if (-not $checkH.Contains("SetMultiGPUFGAdapterOverride")) { throw "v3 header injection failed" }
          if (-not $checkCpp.Contains("forcing internal D3D12CreateDevice(nullptr)")) { throw "v3 hook injection failed" }
          if (-not $checkF.Contains("SetMultiGPUFGAdapterOverride(true)")) { throw "v3 FSRFG scope injection failed" }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        shell: powershell
        run: |
          msbuild upstream\OptiScaler.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package unsigned ZIP
        shell: powershell
        run: |
          $outDir = Join-Path $env:GITHUB_WORKSPACE "upstream\x64\Release\a"
          if (-not (Test-Path $outDir)) { throw "Release output folder not found: $outDir" }
          $archive = Join-Path $env:GITHUB_WORKSPACE "OptiScaler_0.9.4-MultiGPU-FSRFG-v3-unsigned.zip"
          Compress-Archive -Path "$outDir\*" -DestinationPath $archive -CompressionLevel Optimal
          if (-not (Test-Path $archive)) { throw "ZIP archive was not created" }

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OptiScaler_0.9.4-MultiGPU-FSRFG-v3-unsigned-zip
          path: OptiScaler_0.9.4-MultiGPU-FSRFG-v3-unsigned.zip
          compression-level: 0
          if-no-files-found: error
