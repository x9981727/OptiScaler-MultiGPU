name: Build OptiScaler 0.9.4 MultiGPU FSRFG v2 (Unsigned)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4

      - name: Reconstruct base MultiGPU patch
        shell: powershell
        run: |
          $parts = Get-ChildItem "$env:GITHUB_WORKSPACE\patch.b64.part*" | Sort-Object Name
          if ($parts.Count -eq 0) { throw "No patch parts found" }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE\OptiScaler-0.9.4-MultiGPU-FSRFG-WIP.patch", [Convert]::FromBase64String($b64))

      - name: Reconstruct v2 dual-context hotfix
        shell: powershell
        run: |
          $names = @(
            "hotfix-exact.b64.part00",
            "hotfix-exact.b64.part01",
            "hotfix-exact.b64.part02",
            "hotfix-exact.b64.part03",
            "hotfix-exact.b64.part04",
            "hotfix-exact.b64.part05",
            "hotfix-exact.b64.part06"
          )
          $b64 = ($names | ForEach-Object {
            $path = Join-Path $env:GITHUB_WORKSPACE $_
            if (-not (Test-Path $path)) { throw "Missing v2 hotfix part: $_" }
            (Get-Content $path -Raw).Trim()
          }) -join ''
          $bytes = [Convert]::FromBase64String($b64)
          $hotfixPath = "$env:GITHUB_WORKSPACE\MultiGPU-v2-dual-context-hotfix.patch"
          [IO.File]::WriteAllBytes($hotfixPath, $bytes)
          $sha = (Get-FileHash $hotfixPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne "e35187ee474aa07b4a7183ea41e86a96491b99841bc7b09d3983fdea96f9219a") {
            throw "v2 hotfix SHA256 mismatch: $sha"
          }

      - name: Clone OptiScaler v0.9.4 with submodules
        shell: powershell
        run: |
          git clone --branch v0.9.4 --depth 1 --recurse-submodules https://github.com/optiscaler/OptiScaler.git upstream
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C upstream submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply base MultiGPU patch
        shell: powershell
        run: |
          $patch = Join-Path $env:GITHUB_WORKSPACE "OptiScaler-0.9.4-MultiGPU-FSRFG-WIP.patch"
          git -C upstream apply --check $patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C upstream apply $patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore MultiGPU source files
        shell: powershell
        run: |
          function Restore-Base64Parts([string]$pattern, [string]$destination) {
            $parts = Get-ChildItem $pattern | Sort-Object Name
            if ($parts.Count -eq 0) { throw "No source parts found: $pattern" }
            $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
            [IO.File]::WriteAllBytes($destination, [Convert]::FromBase64String($b64))
            Write-Host "Restored $destination ($((Get-Item $destination).Length) bytes)"
          }
          $header = "$env:GITHUB_WORKSPACE\upstream\OptiScaler\framegen\MultiGPU_Dx12.h"
          $source = "$env:GITHUB_WORKSPACE\upstream\OptiScaler\framegen\MultiGPU_Dx12.cpp"
          Restore-Base64Parts "$env:GITHUB_WORKSPACE\src\MultiGPU_Dx12.h.b64.part*" $header
          Restore-Base64Parts "$env:GITHUB_WORKSPACE\src\MultiGPU_Dx12.cpp.b64.part*" $source
          $text = [IO.File]::ReadAllText($source)
          $text = $text.Replace("CreateCommandAlocator", "CreateCommandAllocator")
          [IO.File]::WriteAllText($source, $text, [Text.UTF8Encoding]::new($false))
          if ([IO.File]::ReadAllText($source).Contains("CreateCommandAlocator")) { throw "MultiGPU source typo fixup failed" }

      - name: Apply v2 dual-context hotfix
        shell: powershell
        run: |
          $hotfix = Join-Path $env:GITHUB_WORKSPACE "MultiGPU-v2-dual-context-hotfix.patch"
          git -C upstream apply --check $hotfix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C upstream apply $hotfix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        shell: powershell
        run: |
          msbuild upstream\OptiScaler.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package unsigned ZIP
        shell: powershell
        run: |
          $outDir = Join-Path $env:GITHUB_WORKSPACE "upstream\x64\Release\a"
          if (-not (Test-Path $outDir)) { throw "Release output folder not found: $outDir" }
          $archive = Join-Path $env:GITHUB_WORKSPACE "OptiScaler_0.9.4-MultiGPU-FSRFG-v2-unsigned.zip"
          Compress-Archive -Path "$outDir\*" -DestinationPath $archive -CompressionLevel Optimal
          if (-not (Test-Path $archive)) { throw "ZIP archive was not created" }

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OptiScaler_0.9.4-MultiGPU-FSRFG-v2-unsigned-zip
          path: OptiScaler_0.9.4-MultiGPU-FSRFG-v2-unsigned.zip
          compression-level: 0
          if-no-files-found: error
