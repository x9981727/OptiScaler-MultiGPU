name: Build OptiScaler 0.9.4 MultiGPU FSRFG + XeFG v7 (Unsigned)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4

      - name: Reconstruct base MultiGPU patch
        shell: powershell
        run: |
          $parts = Get-ChildItem "$env:GITHUB_WORKSPACE\patch.b64.part*" | Sort-Object Name
          if ($parts.Count -eq 0) { throw "No patch parts found" }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE\OptiScaler-0.9.4-MultiGPU-FSRFG-WIP.patch", [Convert]::FromBase64String($b64))

      - name: Reconstruct v2 dual-context hotfix
        shell: powershell
        run: |
          $names = @(
            "hotfix-exact.b64.part00",
            "hotfix-exact.b64.part01",
            "hotfix-exact.b64.part02",
            "hotfix-exact.b64.part03",
            "hotfix-exact.b64.part04",
            "hotfix-exact.b64.part05",
            "hotfix-exact.b64.part06"
          )
          $b64 = ($names | ForEach-Object {
            $path = Join-Path $env:GITHUB_WORKSPACE $_
            if (-not (Test-Path $path)) { throw "Missing v2 hotfix part: $_" }
            (Get-Content $path -Raw).Trim()
          }) -join ''
          $bytes = [Convert]::FromBase64String($b64)
          $hotfixPath = "$env:GITHUB_WORKSPACE\MultiGPU-v2-dual-context-hotfix.patch"
          [IO.File]::WriteAllBytes($hotfixPath, $bytes)
          $sha = (Get-FileHash $hotfixPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne "e35187ee474aa07b4a7183ea41e86a96491b99841bc7b09d3983fdea96f9219a") {
            throw "v2 hotfix SHA256 mismatch: $sha"
          }

      - name: Clone OptiScaler v0.9.4 with submodules
        shell: powershell
        run: |
          git clone --branch v0.9.4 --depth 1 --recurse-submodules https://github.com/optiscaler/OptiScaler.git upstream
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C upstream submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply base MultiGPU patch
        shell: powershell
        run: |
          $patch = Join-Path $env:GITHUB_WORKSPACE "OptiScaler-0.9.4-MultiGPU-FSRFG-WIP.patch"
          git -C upstream apply --check $patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C upstream apply $patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore MultiGPU source files
        shell: powershell
        run: |
          function Restore-Base64Parts([string]$pattern, [string]$destination) {
            $parts = Get-ChildItem $pattern | Sort-Object Name
            if ($parts.Count -eq 0) { throw "No source parts found: $pattern" }
            $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
            [IO.File]::WriteAllBytes($destination, [Convert]::FromBase64String($b64))
            Write-Host "Restored $destination ($((Get-Item $destination).Length) bytes)"
          }
          $header = "$env:GITHUB_WORKSPACE\upstream\OptiScaler\framegen\MultiGPU_Dx12.h"
          $source = "$env:GITHUB_WORKSPACE\upstream\OptiScaler\framegen\MultiGPU_Dx12.cpp"
          Restore-Base64Parts "$env:GITHUB_WORKSPACE\src\MultiGPU_Dx12.h.b64.part*" $header
          Restore-Base64Parts "$env:GITHUB_WORKSPACE\src\MultiGPU_Dx12.cpp.b64.part*" $source
          $text = [IO.File]::ReadAllText($source)
          $text = $text.Replace("CreateCommandAlocator", "CreateCommandAllocator")
          [IO.File]::WriteAllText($source, $text, [Text.UTF8Encoding]::new($false))
          if ([IO.File]::ReadAllText($source).Contains("CreateCommandAlocator")) { throw "MultiGPU source typo fixup failed" }

      - name: Apply v2 dual-context hotfix
        shell: powershell
        run: |
          $hotfix = Join-Path $env:GITHUB_WORKSPACE "MultiGPU-v2-dual-context-hotfix.patch"
          git -C upstream apply --check --exclude=OptiScaler/framegen/MultiGPU_Dx12.cpp $hotfix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C upstream apply --exclude=OptiScaler/framegen/MultiGPU_Dx12.cpp $hotfix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fsrfg = Join-Path $env:GITHUB_WORKSPACE "upstream\OptiScaler\framegen\ffx\FSRFG_Dx12.cpp"
          $text = [IO.File]::ReadAllText($fsrfg)
          $text = $text.Replace("auto computeResult = FFX_API_RETURN_OK;", "ffxReturnCode_t computeResult = FFX_API_RETURN_OK;")
          [IO.File]::WriteAllText($fsrfg, $text, [Text.UTF8Encoding]::new($false))

      - name: Apply v3 scoped AMD internal adapter override
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\apply-v3.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply v5 scoped secondary FSR4 isolation
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\apply-v5.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply v6 XeFG virtual-swapchain offload
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\apply-v6-xefg.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply v7 XeFG initialization isolation hotfix
        shell: powershell
        run: |
          $patch = Join-Path $env:GITHUB_WORKSPACE "v7\xefg-init-isolation.patch"
          $sha = (Get-FileHash $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne "690e732e4076ed0e119d9fd43dd41623100b0a226f27a9169267f697a47b5e79") {
            throw "v7 patch SHA256 mismatch: $sha"
          }
          git -C upstream apply --check --directory=OptiScaler $patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C upstream apply --directory=OptiScaler $patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $xefg = [IO.File]::ReadAllText("$env:GITHUB_WORKSPACE\upstream\OptiScaler\framegen\xefg\XeFG_Dx12.cpp")
          $dxgi = [IO.File]::ReadAllText("$env:GITHUB_WORKSPACE\upstream\OptiScaler\hooks\DxgiFactory_Hooks.cpp")
          if (-not $xefg.Contains('MultiGPU v7: isolating XeFG internal DXGI/D3D12 initialization')) { throw "v7 XeFG marker missing" }
          if (-not $dxgi.Contains('MultiGPU v7: passthrough XeFG internal CreateSwapChainForHwnd without Opti wrapping')) { throw "v7 DXGI marker missing" }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        shell: powershell
        run: |
          msbuild upstream\OptiScaler.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify v5 v6 and v7 markers are in compiled DLL
        shell: powershell
        run: |
          $dll = Join-Path $env:GITHUB_WORKSPACE "upstream\x64\Release\a\OptiScaler.dll"
          if (-not (Test-Path $dll)) { throw "Compiled OptiScaler.dll not found: $dll" }
          $ascii = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($dll))
          $markers = @(
            'MultiGPU v5: blocking IAmdExtFfxApi while Fsr4Update is temporarily disabled',
            'MultiGPU v5: temporarily disabling Fsr4Update for secondary FG context',
            'MultiGPU v5: restored Fsr4Update to {}',
            'MultiGPU: scoped internal D3D12 adapter override',
            'MultiGPU v6: XeFG context created on secondary GPU',
            'MultiGPU v6: virtual backbuffer initialization',
            'MultiGPU v6: XeFG proxy swapchain virtualized for the render adapter',
            'MultiGPU v6: virtual backbuffer {} copied to secondary proxy swapchain',
            'MultiGPU v7: isolating XeFG internal DXGI/D3D12 initialization',
            'MultiGPU v7: passthrough D3D12CreateDevice during XeFG internal initialization',
            'MultiGPU v7: passthrough XeFG internal CreateSwapChainForHwnd without Opti wrapping'
          )
          foreach ($marker in $markers) {
            if (-not $ascii.Contains($marker)) { throw "Compiled DLL is missing required marker: $marker" }
            Write-Host "Verified marker: $marker"
          }
          Write-Host "OptiScaler.dll SHA256: $((Get-FileHash $dll -Algorithm SHA256).Hash)"

      - name: Package unsigned ZIP
        shell: powershell
        run: |
          $outDir = Join-Path $env:GITHUB_WORKSPACE "upstream\x64\Release\a"
          if (-not (Test-Path $outDir)) { throw "Release output folder not found: $outDir" }
          $archive = Join-Path $env:GITHUB_WORKSPACE "OptiScaler_0.9.4-MultiGPU-FSRFG-XeFG-v7-unsigned.zip"
          Compress-Archive -Path "$outDir\*" -DestinationPath $archive -CompressionLevel Optimal
          if (-not (Test-Path $archive)) { throw "ZIP archive was not created" }

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OptiScaler_0.9.4-MultiGPU-FSRFG-XeFG-v7-unsigned-zip
          path: OptiScaler_0.9.4-MultiGPU-FSRFG-XeFG-v7-unsigned.zip
          compression-level: 0
          if-no-files-found: error
