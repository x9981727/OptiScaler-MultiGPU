name: RDNA4 r4 original-layer development
on:
  push:
    branches: [dlssnr-rdna4-layer-r4]
    paths: ['rdna4/layer_r4/**', '.github/workflows/rdna4-layer-r4.yml']
permissions:
  contents: read
concurrency:
  group: rdna4-layer-r4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  device:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-19 llvm-19 lld-19
          python -m pip install pyelftools==0.32 msgpack==1.1.1
      - name: Compile head candidates and verify CPU reference
        run: python rdna4/layer_r4/build_layer.py
      - name: Verify real-model weight fixture
        run: python rdna4/layer_r4/check_weight_block.py
      - name: Store compiled candidates and reports
        uses: actions/upload-artifact@v4
        with:
          name: RDNA4-r4-device
          path: |
            rdna4/layer_r4/build/head_r4_gfx1201.hsaco
            rdna4/layer_r4/build/head_r4.isa.txt
            rdna4/layer_r4/build/compile-report.json
            rdna4/layer_r4/build/weight-fixture-report.json
            rdna4/layer_r4/candidate_hash.hpp
          if-no-files-found: error
          retention-days: 7
  windows:
    needs: device
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RDNA4-r4-device
          path: device
      - name: Compile Windows x64 differential tester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item device/candidate_hash.hpp rdna4/layer_r4/
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC x64 not found' }
          $vcvars = Join-Path $vs 'VC/Auxiliary/Build/vcvars64.bat'
          @('@echo off', ('call "'+$vcvars+'"'), 'if errorlevel 1 exit /b 1', 'cl /nologo /std:c++20 /EHsc /O2 /MT /fp:precise /W4 /utf-8 rdna4\layer_r4\head_diff.cpp /Fe:package\rdna4-r4-test.exe /Fo:package\head_diff.obj', 'exit /b %errorlevel%') | Set-Content build-head.cmd -Encoding ascii
          & cmd /d /c build-head.cmd
          if ($LASTEXITCODE -ne 0) { throw 'Differential tester failed to compile' }
      - name: Execute Windows CPU contract tests
        shell: pwsh
        run: |
          & ./package/rdna4-r4-test.exe --cpu-self-test --output package/ci-cpu-test.json
          if ($LASTEXITCODE -ne 0) { throw 'CPU contract tests failed' }
          $report = Get-Content package/ci-cpu-test.json -Raw | ConvertFrom-Json
          if ($report.status -ne 'cpu_tests_passed_gpu_not_run' -or $report.gpu_attempted -or $report.original_head_layer_differential_passed) { throw 'Invalid CI test status' }
          Get-Content package/ci-cpu-test.json
      - name: Assemble binary, sources and honest validation status
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path package/reports,package/source/layer_r4,package/source/tests | Out-Null
          Copy-Item device/build/head_r4_gfx1201.hsaco package/
          Copy-Item device/build/*.json,device/build/head_r4.isa.txt package/reports/
          Move-Item package/ci-cpu-test.json package/reports/
          Copy-Item rdna4/layer_r4/README_zh-TW.md,rdna4/layer_r4/TEST_R4.cmd,rdna4/layer_r4/LICENSE.txt package/
          Copy-Item rdna4/layer_r4/*.cpp,rdna4/layer_r4/*.hpp,rdna4/layer_r4/*.cl,rdna4/layer_r4/*.py package/source/layer_r4/
          Copy-Item rdna4/tests/linear_test.cpp package/source/tests/
          Copy-Item .github/workflows/rdna4-layer-r4.yml package/source/
          Remove-Item package/head_diff.obj -ErrorAction SilentlyContinue
          @{
            repository='x9981727/OptiScaler-MultiGPU'
            branch='dlssnr-rdna4-layer-r4'
            commit=$env:GITHUB_SHA
            run_id=$env:GITHUB_RUN_ID
            compiled_device_code=$true
            compiled_windows_tester=$true
            cpu_contract_tests_passed=$true
            original_code_executed_in_ci=$false
            candidate_gpu_executed_in_ci=$false
            original_layer_equivalence_tested_in_ci=$false
            full_forward_weight_binding_verified=$false
            full_swin_replacement=$false
            full_nr_model_tested=$false
            game_tested=$false
            performance_improvement_claimed=$false
          } | ConvertTo-Json | Set-Content package/BUILD_STATUS.json -Encoding utf8
          $root = (Resolve-Path package).Path
          Get-ChildItem package -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative=$_.FullName.Substring($root.Length+1).Replace('\','/')
            '{0} *{1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(),$relative
          } | Set-Content PACKAGE_SHA256SUMS.txt -Encoding ascii
          Move-Item PACKAGE_SHA256SUMS.txt package/SHA256SUMS.txt
          Get-ChildItem package -Recurse -File | Select-Object FullName,Length
      - name: Upload original-head differential test kit
        uses: actions/upload-artifact@v4
        with:
          name: RDNA4-r4-Original-Head-Diff
          path: package/
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
