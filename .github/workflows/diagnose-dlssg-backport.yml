name: Build DLSSG Backport Baseline

on:
  push:
    branches: [dlssg-backport]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4

      - name: Clone OptiScaler v0.9.4
        shell: powershell
        run: |
          git clone --branch v0.9.4 --depth 1 --recurse-submodules https://github.com/optiscaler/OptiScaler.git upstream
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C upstream submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fetch official DLSSG output commit
        shell: powershell
        run: |
          git -C upstream fetch origin 7a1f18ca121c16ecbd9c15cd3b14ab29273d31a7 --depth=2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply official DLSSG output baseline
        shell: powershell
        run: |
          git -C upstream config user.name "OptiScaler MultiGPU CI"
          git -C upstream config user.email "ci@localhost"
          git -C upstream cherry-pick --no-commit 7a1f18ca121c16ecbd9c15cd3b14ab29273d31a7
          $pickCode = $LASTEXITCODE
          $conflicts = @(git -C upstream diff --name-only --diff-filter=U)
          $keep094 = @(
            'OptiScaler/SysUtils.h',
            'OptiScaler/State.h',
            'OptiScaler/OptiScaler.vcxproj',
            'OptiScaler/OptiScaler.vcxproj.filters',
            'OptiScaler/framegen/IFGFeature.cpp'
          )
          if ($conflicts.Count -gt 0) {
            Write-Host "Resolving DLSSG baseline conflicts:"
            foreach ($file in $conflicts) {
              Write-Host "  $file"
              if ($keep094 -contains $file) {
                git -C upstream checkout --ours -- $file
              } else {
                git -C upstream checkout --theirs -- $file
              }
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              git -C upstream add -- $file
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          $left = @(git -C upstream diff --name-only --diff-filter=U)
          if ($left.Count -gt 0) { throw "Unresolved DLSSG conflicts remain: $($left -join ', ')" }

          # Remove branch-wide dependencies unrelated to DLSSG output. 0.9.4 already has
          # Streamline/DLSSG input hooks, so keep those implementations until the compiler
          # proves an output-specific delta is required.
          $restore094 = @(
            'OptiScaler/Config.cpp',
            'OptiScaler/hooks/Dxgi_Hooks.cpp',
            'OptiScaler/hooks/Reflex_Hooks.cpp',
            'OptiScaler/hooks/Streamline_Hooks.cpp',
            'OptiScaler/inputs/NVNGX_DLSS_Dx12.cpp'
          )
          foreach ($file in $restore094) {
            git -C upstream checkout HEAD -- $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git -C upstream add -- $file
          }

          # v0.9.4 State.h + only the fields/functions required by official DLSSG output.
          $statePath = Join-Path $env:GITHUB_WORKSPACE 'upstream\OptiScaler\State.h'
          $s = [IO.File]::ReadAllText($statePath)
          $s = [regex]::Replace($s,
            '(?m)^(\s*std::optional<std::wstring> NVNGX_DLSSG_Path;\r?\n)',
            '$1' + "`r`n    // DLSSG / Streamline modules`r`n    HMODULE optiSlInterposer = nullptr;`r`n    HMODULE optiSlCommon = nullptr;`r`n    HMODULE optiSlDLSSG = nullptr;`r`n    HMODULE optiSlReflex = nullptr;`r`n    HMODULE optiSlPCL = nullptr;`r`n    HMODULE optiDLSSG = nullptr;`r`n",
            1)
          $s = [regex]::Replace($s,
            '(?m)^(\s*feature_version streamlineVersion = \{ 0, 0, 0 \};\r?\n)',
            '$1' + '    std::optional<int> dlssgMfgMax = std::nullopt;' + "`r`n",
            1)
          $s = [regex]::Replace($s,
            '(?m)^(\s*int xefgMaxInterpolationCount = 1;\r?\n)',
            '$1' + '    int dlssgMaxInterpolationCount = 1;' + "`r`n",
            1)
          $s = [regex]::Replace($s,
            '(?m)^(\s*// Moved checks here to prevent circular includes\r?\n)',
            "    static UINT GetOwner()`r`n    {`r`n        _lastOwner++;`r`n        return _lastOwner;`r`n    }`r`n`r`n" + '$1',
            1)
          $s = [regex]::Replace($s,
            '(?m)^(\s*inline static UINT _skipOwner = 0;\r?\n)',
            '$1' + '    inline static UINT _lastOwner = 0;' + "`r`n",
            1)
          [IO.File]::WriteAllText($statePath, $s, [Text.UTF8Encoding]::new($false))

          foreach ($marker in @('HMODULE optiSlInterposer', 'dlssgMaxInterpolationCount', 'static UINT GetOwner()', '_lastOwner = 0')) {
            if (-not $s.Contains($marker)) { throw "DLSSG State injection failed: $marker" }
          }

          # v0.9.4 project file + only DLSSG output sources.
          $projPath = Join-Path $env:GITHUB_WORKSPACE 'upstream\OptiScaler\OptiScaler.vcxproj'
          $p = [IO.File]::ReadAllText($projPath)
          if (-not $p.Contains('framegen\dlssg\DLSSG_Dx12.h')) {
            $p = $p.Replace(
              '    <ClInclude Include="framegen\ffx\FSRFG_Dx12.h" />',
              '    <ClInclude Include="framegen\dlssg\DLSSG_Dx12.h" />' + "`r`n" + '    <ClInclude Include="framegen\ffx\FSRFG_Dx12.h" />')
          }
          if (-not $p.Contains('proxies\Streamline_Proxy.h')) {
            $p = $p.Replace(
              '    <ClInclude Include="proxies\Dxgi_Proxy.h" />',
              '    <ClInclude Include="proxies\Dxgi_Proxy.h" />' + "`r`n" + '    <ClInclude Include="proxies\Streamline_Proxy.h" />')
          }
          if (-not $p.Contains('framegen\dlssg\DLSSG_Dx12.cpp')) {
            $p = $p.Replace(
              '    <ClCompile Include="framegen\ffx\FSRFG_Dx12.cpp" />',
              '    <ClCompile Include="framegen\dlssg\DLSSG_Dx12.cpp" />' + "`r`n" + '    <ClCompile Include="framegen\ffx\FSRFG_Dx12.cpp" />')
          }
          [IO.File]::WriteAllText($projPath, $p, [Text.UTF8Encoding]::new($false))
          foreach ($marker in @('framegen\dlssg\DLSSG_Dx12.h', 'framegen\dlssg\DLSSG_Dx12.cpp', 'proxies\Streamline_Proxy.h')) {
            if (-not $p.Contains($marker)) { throw "DLSSG project injection failed: $marker" }
          }

          # Preserve 0.9.4 frame-count behaviour except DLSSG output, which supplies an authoritative frame id.
          $ifgPath = Join-Path $env:GITHUB_WORKSPACE 'upstream\OptiScaler\framegen\IFGFeature.cpp'
          $ifg = [IO.File]::ReadAllText($ifgPath)
          if (-not $ifg.Contains('activeFgOutput == FGOutput::DLSSG')) {
            $ifg = [regex]::Replace(
              $ifg,
              '(void IFGFeature::SetFrameCount\(UINT64 frameId\)\r?\n\{\r?\n)',
              '$1' + "    if (State::Instance().activeFgOutput == FGOutput::DLSSG)`r`n    {`r`n        _frameCount = frameId;`r`n        return;`r`n    }`r`n`r`n",
              1)
          }
          [IO.File]::WriteAllText($ifgPath, $ifg, [Text.UTF8Encoding]::new($false))
          if (-not $ifg.Contains('activeFgOutput == FGOutput::DLSSG')) { throw 'DLSSG IFGFeature injection failed' }

          Write-Host "Cherry-pick initial exit code: $pickCode"
          Write-Host "=== BACKPORT STAT ==="
          git -C upstream diff --stat HEAD

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build DLSSG backport baseline
        shell: powershell
        run: |
          msbuild upstream\OptiScaler.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify DLSSG binary markers
        shell: powershell
        run: |
          $dll = "$env:GITHUB_WORKSPACE\upstream\x64\Release\a\OptiScaler.dll"
          if (-not (Test-Path $dll)) { throw "OptiScaler.dll missing" }
          $bytes = [IO.File]::ReadAllBytes($dll)
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          foreach ($marker in @('DLSSG', 'sl.interposer.dll', 'nvngx_dlssg.dll')) {
            if (-not $ascii.Contains($marker)) { throw "DLSSG marker missing from DLL: $marker" }
          }
          Write-Host 'Official DLSSG output is present in compiled binary.'
