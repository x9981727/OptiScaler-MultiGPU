name: RDNA4 r5.1 runnable delivery
on:
  push:
    branches: [dlssnr-rdna4-forward-r5-delivery]
    paths: ['rdna4/forward_r5/**', '.github/workflows/rdna4-r5-delivery.yml']
permissions:
  contents: read
concurrency:
  group: rdna4-r5-delivery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install compilation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-19 llvm-19 lld-19
          python -m pip install pyelftools==0.32 msgpack==1.1.1
      - name: Compile unchanged r4 code and run CPU contract checks
        run: python rdna4/layer_r4/build_layer.py
      - name: Require the GPU binary already validated by the user
        run: |
          echo '62c8ecf66e4290ffbe22230a376b475ef482807fe05c46b957457bff5826cffe  rdna4/layer_r4/build/head_r4_gfx1201.hsaco' | sha256sum -c -
      - name: Test bounded JSON and ZIP support
        run: python rdna4/forward_r5/build_support.py
      - name: Apply source-pinned delivery changes
        run: python rdna4/forward_r5/prepare_delivery.py
      - name: Preserve generated source and build inputs
        uses: actions/upload-artifact@v4
        with:
          name: RDNA4-r5.1-build-inputs
          path: |
            rdna4/layer_r4/build/head_r4_gfx1201.hsaco
            rdna4/layer_r4/build/head_r4.isa.txt
            rdna4/layer_r4/build/compile-report.json
            rdna4/layer_r4/candidate_hash.hpp
            rdna4/forward_r5/forward_delivery.cpp
            rdna4/forward_r5/deps/
            rdna4/forward_r5/build/*.json
            rdna4/forward_r5/build/fixture-*.zip
          if-no-files-found: error
          retention-days: 7
  windows:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RDNA4-r5.1-build-inputs
          path: device
      - name: Compile Windows x64 runnable full-plan tester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item device/layer_r4/candidate_hash.hpp rdna4/layer_r4/
          Copy-Item device/forward_r5/deps rdna4/forward_r5/ -Recurse
          Copy-Item device/forward_r5/forward_delivery.cpp rdna4/forward_r5/
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC x64 toolchain not found' }
          $vcvars = Join-Path $vs 'VC/Auxiliary/Build/vcvars64.bat'
          @('@echo off',('call "'+$vcvars+'"'),'if errorlevel 1 exit /b 1',
            'cl /nologo /O2 /MT /c /TC rdna4\forward_r5\deps\puff.c /Fo:package\puff.obj',
            'if errorlevel 1 exit /b 1',
            'cl /nologo /std:c++20 /EHsc /O2 /MT /fp:precise /W4 /utf-8 rdna4\forward_r5\forward_delivery.cpp package\puff.obj /Fe:package\rdna4-r5-test.exe /Fo:package\forward_delivery.obj',
            'exit /b %errorlevel%') | Set-Content build-delivery.cmd -Encoding ascii
          & cmd /d /c build-delivery.cmd
          if ($LASTEXITCODE -ne 0) { throw 'r5.1 executable compilation failed' }
      - name: Execute CPU tests and both ZIP input modes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path package/reports | Out-Null
          foreach ($mode in @('stored','deflated')) {
            & ./package/rdna4-r5-test.exe --cpu-self-test --fixture "device/forward_r5/build/fixture-$mode.zip" --output "package/reports/ci-$mode.json"
            if ($LASTEXITCODE -ne 0) { throw "CPU ZIP test failed: $mode" }
            $r = Get-Content "package/reports/ci-$mode.json" -Raw | ConvertFrom-Json
            if ($r.status -ne 'cpu_tests_passed_original_plan_and_gpu_not_tested' -or $r.gpu_attempted -or !$r.cpu_zip_fixture_passed -or $r.delivery_revision -ne 'r5.1') { throw 'Unexpected CPU test result' }
            Copy-Item rdna4-r5-console.txt "package/reports/ci-$mode-console.txt"
          }
          & ./package/rdna4-r5-test.exe --this-option-must-fail --output package/reports/ci-rejected-cli.json
          if ($LASTEXITCODE -eq 0) { throw 'Invalid CLI was not rejected' }
          if (!(Test-Path rdna4-r5-console.txt)) { throw 'Live log was not written' }
          if ((Get-Item rdna4-r5-console.txt).Length -eq 0) { throw 'Live log is empty' }
          & ./package/rdna4-r5-test.exe --output package/reports/ci-rejected-cli.json --this-option-must-fail
          if ($LASTEXITCODE -eq 0) { throw 'Malformed CLI was accepted' }
          $bad = Get-Content package/reports/ci-rejected-cli.json -Raw | ConvertFrom-Json
          if ($bad.status -ne 'failed' -or $bad.gpu_attempted -or !$bad.diagnostics) { throw 'Failure diagnostics missing' }
          Copy-Item rdna4-r5-console.txt package/reports/ci-rejected-cli-console.txt
          exit 0
      - name: Assemble self-contained tester with sources and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path package/source/forward_r5,package/source/layer_r4,package/source/tests,package/Licenses | Out-Null
          Copy-Item device/layer_r4/build/head_r4_gfx1201.hsaco package/
          Copy-Item device/layer_r4/build/compile-report.json,device/layer_r4/build/head_r4.isa.txt,device/forward_r5/build/*.json package/reports/
          Copy-Item rdna4/forward_r5/DELIVERY_README_zh-TW.md package/README_zh-TW.md
          Copy-Item rdna4/forward_r5/README_zh-TW.md package/FULL_PLAN_SCOPE_zh-TW.md
          Copy-Item rdna4/forward_r5/TEST_DELIVERY.cmd package/TEST_R5.cmd
          Copy-Item rdna4/layer_r4/LICENSE.txt package/Licenses/INDEPENDENT_SOURCE_MIT.txt
          Copy-Item rdna4/forward_r5/deps/JSON_LICENSE.MIT package/Licenses/
          Copy-Item rdna4/forward_r5/deps/puff.h package/Licenses/PUFF_LICENSE_AND_HEADER.txt
          Copy-Item rdna4/forward_r5/*.cpp,rdna4/forward_r5/*.hpp,rdna4/forward_r5/*.py package/source/forward_r5/
          Copy-Item rdna4/forward_r5/deps package/source/forward_r5/ -Recurse
          Copy-Item rdna4/layer_r4/head_direct.cl,rdna4/layer_r4/head_contract.hpp,rdna4/layer_r4/candidate_hash.hpp,rdna4/layer_r4/build_layer.py package/source/layer_r4/
          Copy-Item rdna4/tests/linear_test.cpp package/source/tests/
          Copy-Item .github/workflows/rdna4-r5-delivery.yml package/source/
          Remove-Item package/*.obj -ErrorAction SilentlyContinue
          @{
            revision='r5.1'
            repository='x9981727/OptiScaler-MultiGPU'
            branch='dlssnr-rdna4-forward-r5-delivery'
            commit=$env:GITHUB_SHA
            run_id=$env:GITHUB_RUN_ID
            compiled_windows_exe=$true
            unchanged_r4_gpu_code_sha256='62c8ecf66e4290ffbe22230a376b475ef482807fe05c46b957457bff5826cffe'
            cpu_contract_and_zip_tests_passed=$true
            live_log_and_error_report_tested=$true
            original_checkpoint_required=$true
            original_checkpoint_included=$false
            actual_original_plan_read_in_ci=$false
            gpu_executed_in_ci=$false
            full_forward_executed_in_ci=$false
            game_tested=$false
            game_deployment_approved=$false
            performance_improvement_claimed=$false
          } | ConvertTo-Json | Set-Content package/BUILD_STATUS.json -Encoding utf8
          $root=(Resolve-Path package).Path
          Get-ChildItem package -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative=$_.FullName.Substring($root.Length+1).Replace('\','/')
            '{0} *{1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(),$relative
          } | Set-Content PACKAGE_SHA256SUMS.txt -Encoding ascii
          Move-Item PACKAGE_SHA256SUMS.txt package/SHA256SUMS.txt
          Get-ChildItem package -Recurse -File | Select-Object FullName,Length
      - name: Upload ready-to-run delivery ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RDNA4-r5.1-Full-Plan-Test
          path: package/
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
